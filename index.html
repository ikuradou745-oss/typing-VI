<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトルスライム</title>
    <!-- このスクリプトには主な構造を書こう（このコメントは消さないでね） -->
    <style>
        /* === ロブロックス風 全体スタイル === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Impact', sans-serif; 
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #4BA3E3 0%, #87CEEB 50%, #B0E0E6 100%);
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rbx-text {
            color: #ffffff;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px  3px 0 #000;
            letter-spacing: 1px;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .hidden {
            display: none !important;
        }

        /* === 初回名前入力画面 === */
        #name-input-screen {
            background: rgba(0, 0, 0, 0.6);
            z-index: 50;
            padding: 40px;
        }

        .welcome-title {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #FFD700;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            background: #5DADE2;
            padding: 30px;
            border: 4px solid #000;
            border-radius: 8px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
        }

        .input-label {
            font-size: 1.2rem;
            text-align: center;
        }

        .text-input {
            padding: 15px;
            font-size: 1.5rem;
            border: 4px solid #000;
            border-radius: 4px;
            background-color: #ffffff;
            color: #000000;
            outline: none;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
        }

        .text-input:focus {
            background-color: #f0f8ff;
        }

        .error-message {
            color: #FF4444;
            font-size: 1.1rem;
            min-height: 1.2em;
            text-align: center;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .primary-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            color: #ffffff;
            background: #32CD32;
            border: 4px solid #000;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 6px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }

        .primary-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #000;
        }

        /* === ホーム画面 === */
        #home-screen {
            justify-content: flex-start;
            padding: 20px;
        }

        .home-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1E90FF;
            border: 4px solid #000;
            border-radius: 8px;
            box-shadow: 4px 4px 0 #000;
            margin-bottom: 50px;
        }

        .game-title {
            font-size: 2.5rem;
            color: #FFD700;
        }

        .header-user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #4682B4;
            padding: 10px 25px;
            border: 3px solid #000;
            border-radius: 6px;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
        }

        .player-name-text {
            font-size: 1.4rem;
        }

        .icon-btn {
            background: #FFD700;
            border: 3px solid #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
        }

        .icon-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .home-main-menu {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 40px;
            width: 100%;
            padding: 0 50px;
            flex-wrap: wrap;
        }

        .menu-btn {
            padding: 30px 50px;
            font-size: 2.2rem;
            border: 5px solid #000;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 0 #000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 300px;
            text-transform: uppercase;
        }

        .menu-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #000;
        }

        .play-btn { background: #32CD32; color: white; }
        .shop-btn { background: #FF8C00; color: white; }
        .equip-btn { background: #9370DB; color: white; }

        /* === チャプター選択画面 === */
        #chapter-screen {
            justify-content: flex-start;
            padding: 20px;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
            width: 100%;
            max-width: 800px;
        }

        .chapter-btn {
            padding: 40px;
            font-size: 2rem;
            border: 5px solid #000;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 0 #000;
            background: #32CD32;
            color: white;
            text-align: center;
            position: relative;
        }

        .chapter-btn:active:not(.locked) {
            transform: translateY(8px);
            box-shadow: 0 0 0 #000;
        }

        .chapter-btn.locked {
            background: #696969;
            cursor: not-allowed;
            color: #ccc;
        }

        .back-btn {
            background: #FF4444;
            padding: 10px 20px;
            font-size: 1.2rem;
            border: 4px solid #000;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            align-self: flex-start;
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        /* === ステージ選択画面 === */
        #stage-screen {
            flex-direction: row;
            background: #2C3E50;
        }
        .stage-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .stage-title {
            font-size: 4rem;
            color: #FFD700;
            margin-bottom: 20px;
        }
        .stage-bottom-btns {
            display: flex;
            gap: 20px;
            margin-top: 50px;
        }
        .stage-sub-btn {
            padding: 15px 25px;
            font-size: 1.5rem;
            border: 4px solid #000;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #000;
        }
        .stage-sub-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #000;
        }
        .stage-right {
            width: 400px;
            background: #34495E;
            border-left: 5px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .start-battle-btn {
            width: 100%;
            padding: 40px;
            font-size: 3rem;
            background: #E74C3C;
            color: white;
            border: 6px solid #000;
            border-radius: 12px;
            box-shadow: 0 10px 0 #000;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }
        .start-battle-btn:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 #000;
            animation: none;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* === バトル画面UI === */
        #battle-screen {
            background: #87CEEB;
            display: flex;
            flex-direction: column;
        }
        
        /* タイピングエリア (最上部) */
        .battle-top {
            height: 180px;
            background: rgba(0,0,0,0.7);
            border-bottom: 5px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        .typing-text-jp {
            font-size: 2.5rem;
            color: #FFF;
            margin-bottom: 10px;
        }
        .typing-text-roma {
            font-size: 3rem;
            color: #FFF;
            letter-spacing: 5px;
            font-family: monospace;
            background: #333;
            padding: 10px 20px;
            border: 3px solid #FFD700;
            border-radius: 8px;
        }
        .typing-text-roma span {
            transition: opacity 0.1s;
        }
        .typing-typed {
            opacity: 0.3;
            color: #A9A9A9;
        }

        /* 拠点HPゲージ */
        .base-hp-container {
            position: absolute;
            top: 20px;
            width: 250px;
            background: #FFF;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 5px;
        }
        .enemy-hp-container { left: 20px; }
        .player-hp-container { right: 20px; }
        .hp-label {
            font-size: 1.2rem;
            color: #000;
            text-align: center;
            margin-bottom: 5px;
        }
        .hp-bar-bg {
            width: 100%;
            height: 20px;
            background: #555;
            border: 2px solid #000;
            border-radius: 4px;
            position: relative;
        }
        .hp-bar-fill {
            height: 100%;
            background: #32CD32;
            width: 100%;
            transition: width 0.2s;
        }
        .enemy-hp-container .hp-bar-fill { background: #FF4444; }
        .hp-text-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #FFF;
            text-shadow: 1px 1px 0 #000;
            line-height: 20px;
        }

        /* バトルフィールド (中央) */
        .battle-middle {
            flex: 1;
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            border-left: 5px solid #000;
            border-right: 5px solid #000;
            background: #A9DFBF;
            box-shadow: inset 0 -20px 0 rgba(0,0,0,0.1);
        }
        
        .base-building {
            position: absolute;
            bottom: 20px;
            width: 100px;
            height: 150px;
            background: #888;
            border: 5px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
        .enemy-base-building { left: 10px; background: #E74C3C; }
        .player-base-building { right: 10px; background: #3498DB; }

        .battle-entity {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.1s;
        }
        .battle-entity.enemy {
            transform: scaleX(-1);
            filter: hue-rotate(180deg) brightness(0.8);
        }

        /* 下部UI (召喚ボタン・お金) */
        .battle-bottom {
            height: 160px;
            background: #2C3E50;
            border-top: 5px solid #000;
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 15px;
        }
        .money-container {
            width: 150px;
            height: 100%;
            background: #F1C40F;
            border: 4px solid #000;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2);
        }
        .money-label { font-size: 1.2rem; color: #000; }
        .money-amount { font-size: 2rem; color: #000; }

        .summon-slots {
            flex: 1;
            display: flex;
            gap: 10px;
            height: 100%;
            overflow-x: auto;
        }
        .summon-btn {
            width: 100px;
            height: 100%;
            background: #95A5A6;
            border: 4px solid #000;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
            box-shadow: 0 4px 0 #000;
        }
        .summon-btn:active:not(.on-cooldown):not(.disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }
        .summon-btn.disabled { filter: grayscale(100%); cursor: not-allowed; }
        .summon-img { width: 50px; height: 50px; object-fit: contain; }
        .summon-cost { font-size: 1.2rem; background: #000; color: #FFF; padding: 2px 5px; border-radius: 4px; width: 100%; text-align: center; }
        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFF;
            font-size: 1.5rem;
            overflow: hidden;
        }

        /* === バトル結果演出 === */
        #battle-result-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-text { font-size: 6rem; text-transform: uppercase; margin-bottom: 30px; }
        .result-win { color: #FFD700; }
        .result-lose { color: #4444FF; }

        /* === フェード演出 === */
        #fade-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #fade-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* === モーダル共通 === */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #5DADE2;
            border: 5px solid #000;
            border-radius: 8px;
            padding: 0;
            width: 95%;
            max-width: 1200px;
            height: 90%;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1E90FF;
            border-bottom: 5px solid #000;
            padding: 15px 25px;
        }

        .modal-title { font-size: 2rem; color: #FFF; }

        .close-btn {
            background: #FF4444;
            color: white;
            border: 4px solid #000;
            width: 45px;
            height: 45px;
            border-radius: 6px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }

        .modal-body {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 25px;
            height: 100%;
            background: #87CEEB;
        }

        /* === 装備モーダル専用スタイル === */
        .equip-section-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 10px;
            background: #4682B4;
            display: inline-block;
            padding: 5px 15px;
            border: 3px solid #000;
            border-radius: 4px;
        }

        .equipped-slots-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: #B0C4DE;
            padding: 15px;
            border: 4px solid #000;
            border-radius: 6px;
        }

        .equip-slot {
            height: 120px;
            border: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #A9A9A9;
            position: relative;
            box-shadow: inset 0 -15px 0 rgba(0,0,0,0.2);
        }

        .equip-slot.filled { background: #87CEFA; }

        .equip-slot-header {
            width: 100%;
            background: #fff;
            color: #000;
            font-size: 0.8rem;
            padding: 2px 5px;
            border-bottom: 3px solid #000;
            display: flex;
            justify-content: space-between;
        }

        .equip-slot img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
            margin-top: 10px;
        }

        .equip-slot-name {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 5px;
            text-align: center;
            width: 100%;
        }

        .search-bar-box { display: flex; gap: 15px; margin: 15px 0; }
        .search-input {
            flex: 1;
            padding: 15px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 6px;
            color: #000;
            font-size: 1.2rem;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
        }

        .slime-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding-bottom: 20px;
        }

        /* 変更: 所持スライムは画像と名前だけのシンプルなボタンに */
        .slime-simple-btn {
            background: #1E90FF;
            border: 4px solid #000;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 4px 4px 0 #000;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .slime-simple-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }
        .slime-simple-btn.equipped-active { background: #9370DB; }
        
        .slime-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: rgba(255,255,255,0.2);
            border: 3px solid #000;
            border-radius: 50%;
            padding: 5px;
        }

        .slime-name { font-size: 1.2rem; color: #FFF; text-align: center; }

        /* スライム詳細モーダル */
        .detail-card {
            background: #fff;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .detail-img { width: 120px; height: 120px; border: 4px solid #000; background: #eee; border-radius: 50%; padding: 10px;}
        .detail-stats {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 1.2rem;
            color: #000;
            background: #f9f9f9;
            padding: 15px;
            border: 3px solid #000;
        }
        .detail-ability { grid-column: span 2; color: #E74C3C; border-top: 2px dashed #000; padding-top: 10px; }
        .equip-toggle-btn {
            width: 100%;
            padding: 15px;
            border: 4px solid #000;
            border-radius: 6px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
        }
        .equip-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #000; }
        .btn-equip-action { background: #32CD32; color: white; }
        .btn-unequip-action { background: #FF4444; color: white; }

        .dev-badge {
            display: block;
            background: #FFD700;
            color: #000;
            font-size: 1rem;
            padding: 5px 10px;
            border: 2px solid #000;
            border-radius: 4px;
            margin-top: 10px;
            text-shadow: none;
        }
        .dev-message-box {
            text-align: center;
            padding: 50px;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 6px 6px 0 #000;
            margin: auto;
            border-radius: 8px;
        }
        .dev-message-box p { color: #000; font-size: 2rem; text-shadow: none; }
    </style>
</head>
<body>

    <div id="app">
        <!-- フェード演出用 -->
        <div id="fade-overlay"></div>

        <!-- 1. 初回名前入力画面 -->
        <div id="name-input-screen" class="screen hidden">
            <h2 class="welcome-title rbx-text">⚔️ バトルスライムへようこそ！ ⚔️</h2>
            <div class="input-group">
                <label for="initial-name-input" class="input-label rbx-text">名前を入力してね（3文字以上12文字以下）</label>
                <input type="text" id="initial-name-input" class="text-input" placeholder="例: スライム勇者" maxlength="12">
                <div id="initial-name-error" class="error-message"></div>
                <button id="initial-name-submit-btn" class="primary-btn rbx-text">決定</button>
            </div>
        </div>

        <!-- 2. ホーム画面 -->
        <div id="home-screen" class="screen hidden">
            <header class="home-header">
                <h1 class="game-title rbx-text">バトルスライム</h1>
                <div class="header-user-info">
                    <span id="player-display-name" class="player-name-text rbx-text">----</span>
                    <button id="btn-settings" class="icon-btn" title="設定">⚙️</button>
                </div>
            </header>
            <main class="home-main-menu">
                <button id="btn-play" class="menu-btn play-btn rbx-text">🎮 プレイ</button>
                <button id="btn-shop" class="menu-btn shop-btn rbx-text">🛒 ショップ</button>
                <button id="btn-equip" class="menu-btn equip-btn rbx-text">🎒 装備</button>
            </main>
        </div>

        <!-- 3. チャプター選択画面 -->
        <div id="chapter-screen" class="screen hidden">
            <header class="home-header">
                <button id="back-to-home-btn" class="back-btn rbx-text">◀ 戻る</button>
                <h1 class="game-title rbx-text">チャプター選択</h1>
                <div style="width: 80px;"></div>
            </header>
            <div class="chapter-grid">
                <button id="chapter-1-btn" class="chapter-btn rbx-text">
                    📖 チャプター 1
                </button>
                <button class="chapter-btn locked rbx-text">
                    📖 チャプター 2<br><span class="dev-badge">開発中...</span>
                </button>
                <button class="chapter-btn locked rbx-text">
                    📖 チャプター 3<br><span class="dev-badge">開発中...</span>
                </button>
                <button class="chapter-btn locked rbx-text">
                    📖 チャプター 4<br><span class="dev-badge">開発中...</span>
                </button>
            </div>
        </div>

        <!-- 4. ステージ選択画面 -->
        <div id="stage-screen" class="screen hidden">
            <div class="stage-left">
                <button id="back-to-chapter-btn" class="back-btn rbx-text" style="position:absolute; top:20px; left:20px;">◀ 戻る</button>
                <h2 class="stage-title rbx-text">ステージ 1：はじまりの草原</h2>
                <div class="stage-bottom-btns">
                    <button id="stage-equip-btn" class="stage-sub-btn equip-btn rbx-text">🎒 装備</button>
                    <button id="stage-shop-btn" class="stage-sub-btn shop-btn rbx-text">🛒 ショップ</button>
                    <button id="stage-enemy-info-btn" class="stage-sub-btn rbx-text" style="background:#95A5A6; color:#FFF;">👾 出現する敵</button>
                </div>
            </div>
            <div class="stage-right">
                <button id="start-battle-btn" class="start-battle-btn rbx-text">▶ プレイ</button>
            </div>
        </div>

        <!-- 5. バトル画面 -->
        <div id="battle-screen" class="screen hidden">
            <div class="battle-top">
                <div class="base-hp-container enemy-hp-container">
                    <div class="hp-label rbx-text">😈 敵の基地</div>
                    <div class="hp-bar-bg">
                        <div id="enemy-hp-fill" class="hp-bar-fill"></div>
                        <div id="enemy-hp-text" class="hp-text-overlay">300 / 300</div>
                    </div>
                </div>
                <div class="base-hp-container player-hp-container">
                    <div class="hp-label rbx-text">🏰 自分の基地</div>
                    <div class="hp-bar-bg">
                        <div id="player-hp-fill" class="hp-bar-fill"></div>
                        <div id="player-hp-text" class="hp-text-overlay">300 / 300</div>
                    </div>
                </div>

                <div id="typing-text-jp" class="typing-text-jp rbx-text">タイピングする文字</div>
                <div id="typing-text-roma" class="typing-text-roma rbx-text">
                    <!-- JSでspan生成 -->
                </div>
            </div>

            <div id="battle-field" class="battle-middle">
                <div class="base-building enemy-base-building rbx-text">敵陣</div>
                <div class="base-building player-base-building rbx-text">自陣</div>
                <!-- JSでEntity(キャラ)を追加 -->
            </div>

            <div class="battle-bottom">
                <div class="money-container">
                    <div class="money-label rbx-text">所持金</div>
                    <div id="money-display" class="money-amount rbx-text">0円</div>
                </div>
                <div id="summon-slots-container" class="summon-slots">
                    <!-- JSで召喚ボタン生成 -->
                </div>
            </div>

            <!-- バトル結果オーバーレイ -->
            <div id="battle-result-overlay" class="hidden">
                <h1 id="battle-result-text" class="result-text rbx-text"></h1>
                <button id="battle-result-close-btn" class="primary-btn rbx-text">戻る</button>
            </div>
        </div>

        <!-- 各種モーダル -->
        <div id="modal-settings" class="modal-overlay hidden">
            <div class="modal-content" style="max-width: 600px; height: auto;">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">⚙️ 設定</h3>
                    <button id="close-settings-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body" style="background: #5DADE2;">
                    <div class="input-group" style="max-width: 100%; box-shadow: none; border: none; padding: 0;">
                        <label for="settings-name-input" class="input-label rbx-text">名前の変更（3文字以上12文字以下）</label>
                        <input type="text" id="settings-name-input" class="text-input" maxlength="12">
                        <div id="settings-name-error" class="error-message"></div>
                        <button id="save-settings-btn" class="primary-btn rbx-text">変更を保存</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-play" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🎮 モード選択</h3>
                    <button id="close-play-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="mode-selection-container" style="display: flex; gap: 30px; justify-content: center; padding: 40px 0; height: 100%; align-items: center;">
                        <button id="main-mode-btn" class="primary-btn rbx-text" style="padding: 40px; font-size: 2rem;">
                            ⚔️ メインモード
                        </button>
                        <button class="primary-btn rbx-text" style="padding: 40px; font-size: 2rem; background: #696969; cursor: not-allowed;">
                            🎯 サブモード <span class="dev-badge">開発中</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-shop" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🛒 ショップ</h3>
                    <button id="close-shop-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="dev-message-box">
                        <p style="font-weight: bold;">🛒 ショップは現在準備・開発中です！</p>
                        <p style="font-size: 1.2rem; margin-top: 20px; color: #555;">今後のアップデートをお楽しみに！</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-equip" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🎒 スライム装備</h3>
                    <button id="close-equip-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div>
                        <div class="equip-section-title rbx-text">装備中のスライム（最大8体）</div>
                        <div id="equipped-slots-grid" class="equipped-slots-container"></div>
                    </div>
                    <div class="search-bar-box">
                        <input type="text" id="slime-search-input" class="search-input" placeholder="🔍 スライムを名前で検索...">
                    </div>
                    <div>
                        <div class="equip-section-title rbx-text">
                            <a id="chara-part"></a>所持スライム一覧 (タップして詳細/装備)
                        </div>
                        <div id="owned-slime-list" class="slime-list-grid"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 新規: 装備詳細モーダル -->
        <div id="modal-equip-detail" class="modal-overlay hidden" style="z-index: 150;">
            <div class="modal-content" style="max-width: 600px; height: auto;">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🔍 スライム詳細</h3>
                    <button id="close-equip-detail-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body" id="equip-detail-body">
                    <!-- JSで動的生成 -->
                </div>
            </div>
        </div>

        <div id="modal-enemy-info" class="modal-overlay hidden" style="z-index: 150;">
            <div class="modal-content" style="max-width: 500px; height: auto;">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">👾 出現する敵</h3>
                    <button id="close-enemy-info-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body" style="background:#FFF;">
                    <h2 style="color:#000; text-align:center;">スライム (初期)</h2>
                    <p style="color:#333; text-align:center; font-size:1.2rem; margin-top:10px;">最初から出現する最も基本的な敵です。</p>
                </div>
            </div>
        </div>

    </div>

    <!-- キャラクター構造・ステータス設定スクリプト -->
    <script src="sub.js"></script>
    <!-- バトルシステムスクリプト -->
    <script src="battle.js"></script>

    <!-- メイン操作・UI連動スクリプト -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            PlayerDataManager.load();

            // 画面要素
            const nameInputScreen = document.getElementById('name-input-screen');
            const homeScreen = document.getElementById('home-screen');
            const chapterScreen = document.getElementById('chapter-screen');
            const stageScreen = document.getElementById('stage-screen');
            const battleScreen = document.getElementById('battle-screen');
            
            // 初回
            const initialNameInput = document.getElementById('initial-name-input');
            const initialNameError = document.getElementById('initial-name-error');
            const initialNameSubmitBtn = document.getElementById('initial-name-submit-btn');
            
            // ホーム
            const playerDisplayName = document.getElementById('player-display-name');
            const btnSettings = document.getElementById('btn-settings');
            const btnPlay = document.getElementById('btn-play');
            const btnShop = document.getElementById('btn-shop');
            const btnEquip = document.getElementById('btn-equip');

            // モーダル
            const modalSettings = document.getElementById('modal-settings');
            const saveSettingsBtn = document.getElementById('save-settings-btn');
            const closeSettingsBtn = document.getElementById('close-settings-btn');
            
            const modalPlay = document.getElementById('modal-play');
            const closePlayBtn = document.getElementById('close-play-btn');
            const mainModeBtn = document.getElementById('main-mode-btn');

            const modalShop = document.getElementById('modal-shop');
            const closeShopBtn = document.getElementById('close-shop-btn');

            const modalEquip = document.getElementById('modal-equip');
            const closeEquipBtn = document.getElementById('close-equip-btn');
            
            const modalEquipDetail = document.getElementById('modal-equip-detail');
            const closeEquipDetailBtn = document.getElementById('close-equip-detail-btn');
            const equipDetailBody = document.getElementById('equip-detail-body');

            const modalEnemyInfo = document.getElementById('modal-enemy-info');
            const closeEnemyInfoBtn = document.getElementById('close-enemy-info-btn');

            const slimeSearchInput = document.getElementById('slime-search-input');
            const equippedSlotsGrid = document.getElementById('equipped-slots-grid');
            const ownedSlimeList = document.getElementById('owned-slime-list');

            // 画面遷移・フェード用
            function switchScreen(hideEl, showEl) {
                if(hideEl) hideEl.classList.add('hidden');
                if(showEl) showEl.classList.remove('hidden');
            }
            
            function fadeTransition(hideEl, showEl, callback) {
                const fade = document.getElementById('fade-overlay');
                fade.classList.add('active');
                
                setTimeout(() => {
                    switchScreen(hideEl, showEl);
                    if(callback) callback();
                    
                    setTimeout(() => {
                        fade.classList.remove('active');
                    }, 500);
                }, 500);
            }

            function checkInitialFlow() {
                if (PlayerDataManager.hasName()) {
                    switchScreen(nameInputScreen, homeScreen);
                    playerDisplayName.textContent = PlayerDataManager.getName();
                } else {
                    switchScreen(homeScreen, nameInputScreen);
                }
            }

            function validateName(name) {
                if (!name || name.trim().length === 0) return '名前を入力してください。';
                if (name.trim().length < 3 || name.trim().length > 12) return '名前は3文字以上12文字以下で入力してください。';
                return null;
            }

            initialNameSubmitBtn.addEventListener('click', () => {
                const error = validateName(initialNameInput.value);
                if (error) { initialNameError.textContent = error; } else {
                    initialNameError.textContent = '';
                    PlayerDataManager.setName(initialNameInput.value.trim());
                    checkInitialFlow();
                }
            });

            btnSettings.addEventListener('click', () => {
                document.getElementById('settings-name-input').value = PlayerDataManager.getName();
                modalSettings.classList.remove('hidden');
            });
            closeSettingsBtn.addEventListener('click', () => modalSettings.classList.add('hidden'));
            saveSettingsBtn.addEventListener('click', () => {
                const val = document.getElementById('settings-name-input').value;
                const error = validateName(val);
                if (error) { document.getElementById('settings-name-error').textContent = error; } else {
                    PlayerDataManager.setName(val.trim());
                    playerDisplayName.textContent = PlayerDataManager.getName();
                    modalSettings.classList.add('hidden');
                }
            });

            // メニューから各画面へ
            btnPlay.addEventListener('click', () => modalPlay.classList.remove('hidden'));
            closePlayBtn.addEventListener('click', () => modalPlay.classList.add('hidden'));
            btnShop.addEventListener('click', () => modalShop.classList.remove('hidden'));
            closeShopBtn.addEventListener('click', () => modalShop.classList.add('hidden'));
            btnEquip.addEventListener('click', () => {
                renderEquipModal();
                modalEquip.classList.remove('hidden');
            });
            closeEquipBtn.addEventListener('click', () => modalEquip.classList.add('hidden'));
            
            // ステージ選択内の装備・ショップ
            document.getElementById('stage-equip-btn').addEventListener('click', () => {
                renderEquipModal();
                modalEquip.classList.remove('hidden');
            });
            document.getElementById('stage-shop-btn').addEventListener('click', () => {
                modalShop.classList.remove('hidden');
            });
            document.getElementById('stage-enemy-info-btn').addEventListener('click', () => {
                modalEnemyInfo.classList.remove('hidden');
            });
            closeEnemyInfoBtn.addEventListener('click', () => modalEnemyInfo.classList.add('hidden'));

            // プレイモード遷移
            mainModeBtn.addEventListener('click', () => {
                modalPlay.classList.add('hidden');
                fadeTransition(homeScreen, chapterScreen);
            });
            document.getElementById('back-to-home-btn').addEventListener('click', () => {
                fadeTransition(chapterScreen, homeScreen);
            });
            document.getElementById('chapter-1-btn').addEventListener('click', () => {
                fadeTransition(chapterScreen, stageScreen);
            });
            document.getElementById('back-to-chapter-btn').addEventListener('click', () => {
                fadeTransition(stageScreen, chapterScreen);
            });

            // バトル開始
            document.getElementById('start-battle-btn').addEventListener('click', () => {
                fadeTransition(stageScreen, battleScreen, () => {
                    if (window.BattleManager) {
                        window.BattleManager.startBattle();
                    }
                });
            });

            // 装備画面の描画
            slimeSearchInput.addEventListener('input', () => renderOwnedSlimes(slimeSearchInput.value));

            function renderEquipModal() {
                renderEquippedSlots();
                renderOwnedSlimes(slimeSearchInput.value);
            }

            function renderEquippedSlots() {
                equippedSlotsGrid.innerHTML = '';
                const equippedList = PlayerDataManager.getEquippedSlimes();
                for (let i = 0; i < 8; i++) {
                    const slotEl = document.createElement('div');
                    slotEl.className = 'equip-slot';
                    const header = document.createElement('div');
                    header.className = 'equip-slot-header';
                    header.innerHTML = `<span>SLOT ${i + 1}</span>`;
                    slotEl.appendChild(header);

                    if (i < equippedList.length) {
                        const slime = equippedList[i];
                        slotEl.classList.add('filled');
                        const img = document.createElement('img');
                        img.src = slime.image;
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'equip-slot-name rbx-text';
                        nameSpan.textContent = slime.name;
                        slotEl.appendChild(img);
                        slotEl.appendChild(nameSpan);
                    } else {
                        const emptyText = document.createElement('span');
                        emptyText.className = 'equip-slot-name rbx-text';
                        emptyText.style.color = '#555';
                        emptyText.textContent = 'EMPTY';
                        emptyText.style.margin = 'auto';
                        slotEl.appendChild(emptyText);
                    }
                    equippedSlotsGrid.appendChild(slotEl);
                }
            }

            function renderOwnedSlimes(keyword = '') {
                ownedSlimeList.innerHTML = '';
                const slimes = PlayerDataManager.searchOwnedSlimes(keyword);
                if (slimes.length === 0) {
                    ownedSlimeList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #000; font-size: 1.5rem; background: #fff; padding: 20px; border: 4px solid #000;">該当するスライムが見つかりません。</div>';
                    return;
                }

                slimes.forEach(slime => {
                    const isEquipped = PlayerDataManager.isEquipped(slime.id);
                    const btn = document.createElement('div');
                    btn.className = `slime-simple-btn ${isEquipped ? 'equipped-active' : ''}`;
                    // 変更: 画像と名前のみ表示
                    btn.innerHTML = `
                        <img src="${slime.image}" alt="${slime.name}" class="slime-img">
                        <div class="slime-name rbx-text">${slime.name}</div>
                    `;
                    btn.addEventListener('click', () => showEquipDetailModal(slime));
                    ownedSlimeList.appendChild(btn);
                });
            }

            function showEquipDetailModal(slime) {
                const isEquipped = PlayerDataManager.isEquipped(slime.id);
                equipDetailBody.innerHTML = `
                    <div class="detail-card">
                        <img src="${slime.image}" alt="${slime.name}" class="detail-img">
                        <h2 class="rbx-text" style="color:#000;">${slime.name}</h2>
                        <div class="detail-stats">
                            <div>❤️ HP: ${slime.hp}</div>
                            <div>⚔️ 攻撃: ${slime.attack}</div>
                            <div>💰 コスト: ${slime.cost}</div>
                            <div>⏳ 準備タイム: ${slime.cooldown}s</div>
                            <div class="detail-ability">✨ 能力: ${slime.ability}</div>
                        </div>
                        <button id="detail-equip-toggle-btn" class="equip-toggle-btn rbx-text ${isEquipped ? 'btn-unequip-action' : 'btn-equip-action'}">
                            ${isEquipped ? '装備解除する' : '装備する'}
                        </button>
                    </div>
                `;
                
                document.getElementById('detail-equip-toggle-btn').addEventListener('click', () => {
                    const result = PlayerDataManager.toggleEquip(slime.id);
                    if (!result.success) {
                        alert(result.message);
                    } else {
                        renderEquipModal();
                        modalEquipDetail.classList.add('hidden');
                    }
                });
                
                modalEquipDetail.classList.remove('hidden');
            }
            closeEquipDetailBtn.addEventListener('click', () => modalEquipDetail.classList.add('hidden'));

            checkInitialFlow();
            
            // バトル終了処理からの戻り
            document.getElementById('battle-result-close-btn').addEventListener('click', () => {
                document.getElementById('battle-result-overlay').classList.add('hidden');
                fadeTransition(battleScreen, chapterScreen);
            });
        });
    </script>
</body>
</html>
