<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトルスライム</title>
    <style>
        /* 全体の基本設定（ブロスタ風・ポップで太い枠線のUI） */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #87CEEB;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            font-weight: 900;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 画面コンテナ */
        .screen {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* 汎用ボタン（太枠・シャドウ付き） */
        .btn {
            border: 4px solid #000;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: 900;
            color: #000;
            cursor: pointer;
            box-shadow: 0 6px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
        }
        
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #000;
        }

        .btn-yellow { background-color: #F1C40F; }
        .btn-blue { background-color: #3498DB; color: #FFF; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
        .btn-green { background-color: #2ECC71; }
        .btn-red { background-color: #E74C3C; color: #FFF; }
        .btn-gray { background-color: #95A5A6; color: #FFF; }

        /* 名前入力画面のスタイル */
        #name-input-container {
            background-color: #FFF;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 0 #000;
        }

        #name-input-container h1 {
            margin-top: 0;
            font-size: 20px;
        }

        #player-name-input, .custom-input {
            border: 4px solid #000;
            border-radius: 6px;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            width: 80%;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }

        /* ホーム画面のスタイル */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }

        .money-display {
            background-color: #F1C40F;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 5px 15px;
            font-size: 20px;
            box-shadow: 0 4px 0 #000;
        }

        .player-info {
            display: flex;
            align-items: center;
            background-color: #FFF;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 5px 15px;
            box-shadow: 0 4px 0 #000;
            gap: 10px;
        }

        .settings-icon {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .settings-icon:hover {
            transform: rotate(45deg);
        }

        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        /* プレイモード画面（全画面）のスタイル */
        .play-mode-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .mode-btn {
            width: 350px;
            height: 450px;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            flex-direction: column;
            gap: 20px;
        }

        .mode-title {
            font-size: 48px;
            margin-bottom: 30px;
            color: #FFF;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        /* 装備画面のスタイル */
        .equip-container {
            width: 90%;
            height: 90%;
            background-color: #A9DFBF;
            border: 6px solid #000;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 18px;
            z-index: 10;
        }

        .section-title {
            font-size: 24px;
            border-bottom: 4px solid #000;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .equipped-area {
            flex: 1;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .owned-area {
            flex: 2;
            background-color: rgba(255, 255, 255, 0.5);
            border: 4px solid #000;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .search-bar {
            border: 4px solid #000;
            border-radius: 6px;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
        }

        .character-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            overflow-y: auto;
        }

        .chara-card {
            width: 100px;
            height: 130px;
            background-color: #FFF;
            border: 4px solid #000;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            box-shadow: 0 4px 0 #000;
            cursor: pointer;
        }
        
        .chara-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .chara-card .chara-name {
            font-size: 14px;
            text-align: center;
            word-break: break-all;
        }

        .chara-slot {
            min-width: 100px;
            height: 130px;
            background-color: rgba(0,0,0,0.1);
            border: 4px dashed #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            color: #333;
        }

        /* モーダル用（設定・詳細・メッセージ） */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #FFF;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 0 #000;
        }

        /* キャラクター詳細テキスト */
        .detail-text-box {
            font-size: 18px;
            text-align: left;
            line-height: 1.8;
            margin: 15px 0;
            background-color: #E8F8F5;
            padding: 15px;
            border: 4px solid #000;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- 名前入力画面（初回のみ） -->
    <div id="screen-name-input" class="screen">
        <div id="name-input-container">
            <h1>名前を入力してね<br>（3文字以上12文字以下）</h1>
            <input type="text" id="player-name-input" placeholder="名前を入力" maxlength="12">
            <br>
            <button class="btn btn-yellow" id="btn-decide-name">決定</button>
        </div>
    </div>

    <!-- ホーム画面 -->
    <div id="screen-home" class="screen">
        <div class="top-bar">
            <div class="money-display" id="money-display">所持金 0円</div>
            <div class="player-info">
                <span id="display-player-name">プレイヤー</span>
                <span class="settings-icon" id="btn-settings">⚙️</span>
            </div>
        </div>
        <div class="home-menu">
            <button class="btn btn-yellow" id="btn-play">プレイ</button>
            <button class="btn btn-blue" id="btn-shop">ショップ</button>
            <button class="btn btn-green" id="btn-equip">装備</button>
        </div>
    </div>

    <!-- プレイモード選択画面（全画面） -->
    <div id="screen-play" class="screen">
        <button class="btn btn-red close-btn" id="btn-close-play">ホームに戻る</button>
        <div class="mode-title">モード選択</div>
        <div class="play-mode-container">
            <button class="btn btn-yellow mode-btn" id="btn-main-mode">メインモード</button>
            <button class="btn btn-blue mode-btn" id="btn-sub-mode">サブモード</button>
        </div>
    </div>

    <!-- 装備画面 -->
    <div id="screen-equip" class="screen">
        <div class="equip-container">
            <button class="btn btn-red close-btn" id="btn-close-equip">戻る</button>
            
            <a name="Chara" id="Chara"></a> <!-- Chara Anchor Tool -->
            
            <div class="section-title">装備しているキャラ (最大8体)</div>
            <div class="equipped-area" id="equipped-list">
                <!-- Javascriptでスロットを生成します -->
            </div>

            <div class="owned-area">
                <div class="section-title">持っているスライム</div>
                <input type="text" id="search-slime" class="search-bar" placeholder="名前を検索してスライムを探す...">
                <div class="character-grid" id="owned-list">
                    <!-- Javascriptでキャラ一覧を生成します -->
                </div>
            </div>
        </div>
    </div>

    <!-- 設定モーダル（名前変更） -->
    <div id="modal-settings" class="modal-overlay">
        <div class="modal-content" style="min-width: 300px;">
            <h2 style="margin-top: 0;">名前の変更</h2>
            <input type="text" id="settings-name-input" class="custom-input" placeholder="新しい名前 (3〜12文字)" maxlength="12" style="width: 90%; margin: 0 auto 15px auto;">
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-red" id="btn-close-settings" style="padding: 10px 20px; font-size: 18px;">キャンセル</button>
                <button class="btn btn-yellow" id="btn-update-name" style="padding: 10px 20px; font-size: 18px;">変更する</button>
            </div>
        </div>
    </div>

    <!-- キャラクター詳細モーダル（アラートの代わり） -->
    <div id="modal-chara-detail" class="modal-overlay">
        <div class="modal-content" style="width: 80%; max-width: 400px;">
            <h2 id="detail-name" style="margin-top: 0; font-size: 28px;">名前</h2>
            <img id="detail-image" src="" alt="" style="width: 120px; height: 120px; margin: 0 auto; display: block; object-fit: contain;">
            
            <div class="detail-text-box">
                <div><strong>❤️ HP:</strong> <span id="detail-hp"></span></div>
                <div style="margin-top: 5px;"><strong>⚔️ 攻撃力:</strong> <span id="detail-attack"></span></div>
                <div style="margin-top: 15px; padding-top: 15px; border-top: 2px dashed #000;">
                    <strong>✨ 能力:</strong><br>
                    <span id="detail-ability" style="display: inline-block; margin-top: 5px;"></span>
                </div>
            </div>

            <button class="btn btn-red" id="btn-close-detail">閉じる</button>
        </div>
    </div>

    <!-- 汎用メッセージモーダル（アラートの代わり） -->
    <div id="modal-message" class="modal-overlay">
        <div class="modal-content" style="min-width: 250px;">
            <h3 id="message-text" style="line-height: 1.5; margin-bottom: 20px;">メッセージ</h3>
            <button class="btn btn-blue" id="btn-close-message">OK</button>
        </div>
    </div>

    <!-- JSファイル読み込み -->
    <script src="sub.js"></script>
</body>
</html>
