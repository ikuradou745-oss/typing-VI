<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトルスライム</title>
    <!-- このスクリプトには主な構造を書こう（このコメントは消さないでね） -->
    <style>
        /* === ロブロックス風 全体スタイル === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* ゴツくて太いフォントを指定 */
            font-family: 'Arial Black', 'Impact', sans-serif; 
            user-select: none;
        }

        body {
            /* スクリーンショットのような空のグラデーション */
            background: linear-gradient(180deg, #4BA3E3 0%, #87CEEB 50%, #B0E0E6 100%);
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ロブロックス特有の文字の黒縁取り */
        .rbx-text {
            color: #ffffff;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px  3px 0 #000;
            letter-spacing: 1px;
        }

        /* 画面全体を使用するように変更 */
        #app {
            width: 100vw;
            height: 100vh;
            max-width: none;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.2s ease;
        }

        .hidden {
            display: none !important;
        }

        /* === 初回名前入力画面 === */
        #name-input-screen {
            background: rgba(0, 0, 0, 0.6);
            z-index: 50;
            padding: 40px;
        }

        .welcome-title {
            font-size: 3rem;
            margin-bottom: 30px;
            color: #FFD700;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            background: #5DADE2;
            padding: 30px;
            border: 4px solid #000;
            border-radius: 8px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.8);
        }

        .input-label {
            font-size: 1.2rem;
            text-align: center;
        }

        .text-input {
            padding: 15px;
            font-size: 1.5rem;
            border: 4px solid #000;
            border-radius: 4px;
            background-color: #ffffff;
            color: #000000;
            outline: none;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
        }

        .text-input:focus {
            background-color: #f0f8ff;
        }

        .error-message {
            color: #FF4444;
            font-size: 1.1rem;
            min-height: 1.2em;
            text-align: center;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* ゴツいボタン共通スタイル */
        .primary-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            color: #ffffff;
            background: #32CD32;
            border: 4px solid #000;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 6px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }

        .primary-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #000;
        }

        /* === ホーム画面 === */
        #home-screen {
            justify-content: flex-start;
            padding: 20px;
        }

        .home-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1E90FF;
            border: 4px solid #000;
            border-radius: 8px;
            box-shadow: 4px 4px 0 #000;
            margin-bottom: 50px;
        }

        .game-title {
            font-size: 2.5rem;
            color: #FFD700;
        }

        .header-user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #4682B4;
            padding: 10px 25px;
            border: 3px solid #000;
            border-radius: 6px;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
        }

        .player-name-text {
            font-size: 1.4rem;
        }

        .icon-btn {
            background: #FFD700;
            border: 3px solid #000;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
        }

        .icon-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .home-main-menu {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 40px;
            width: 100%;
            padding: 0 50px;
            flex-wrap: wrap;
        }

        .menu-btn {
            padding: 30px 50px;
            font-size: 2.2rem;
            border: 5px solid #000;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 0 #000;
            transition: transform 0.1s, filter 0.2s, box-shadow 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 300px;
            text-transform: uppercase;
        }

        .menu-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #000;
        }

        .play-btn { background: #32CD32; color: white; }
        .shop-btn { background: #FF8C00; color: white; }
        .equip-btn { background: #9370DB; color: white; }

        /* === モーダル共通（画面を広く使う） === */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #5DADE2;
            border: 5px solid #000;
            border-radius: 8px;
            padding: 0;
            width: 95%;
            max-width: 1200px;
            height: 90%;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1E90FF;
            border-bottom: 5px solid #000;
            padding: 15px 25px;
        }

        .modal-title {
            font-size: 2rem;
            color: #FFF;
        }

        .close-btn {
            background: #FF4444;
            color: white;
            border: 4px solid #000;
            width: 45px;
            height: 45px;
            border-radius: 6px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .modal-body {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 25px;
            height: 100%;
            background: #87CEEB;
        }

        /* === 装備モーダル専用スタイル（スクショ風） === */
        .equip-section-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 10px;
            background: #4682B4;
            display: inline-block;
            padding: 5px 15px;
            border: 3px solid #000;
            border-radius: 4px;
        }

        .equipped-slots-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: #B0C4DE;
            padding: 15px;
            border: 4px solid #000;
            border-radius: 6px;
        }

        .equip-slot {
            height: 120px;
            border: 4px solid #000;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #A9A9A9;
            position: relative;
            box-shadow: inset 0 -15px 0 rgba(0,0,0,0.2);
        }

        .equip-slot.filled {
            background: #87CEFA;
        }

        .equip-slot-header {
            width: 100%;
            background: #fff;
            color: #000;
            font-size: 0.8rem;
            padding: 2px 5px;
            border-bottom: 3px solid #000;
            display: flex;
            justify-content: space-between;
        }

        .equip-slot img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
            margin-top: 10px;
        }

        .equip-slot-name {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 5px;
            text-align: center;
            width: 100%;
        }

        .search-bar-box {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 6px;
            color: #000;
            font-size: 1.2rem;
            font-family: 'Arial Black', sans-serif;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.1);
        }

        .slime-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding-bottom: 20px;
        }

        .slime-card {
            background: #1E90FF;
            border: 4px solid #000;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 4px 4px 0 #000;
        }

        .slime-card.equipped-active {
            background: #9370DB;
        }

        .slime-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: rgba(255,255,255,0.2);
            border: 3px solid #000;
            border-radius: 50%;
            padding: 5px;
        }

        .slime-name {
            font-size: 1.4rem;
            color: #FFF;
            text-align: center;
        }

        .slime-stats {
            width: 100%;
            font-size: 1rem;
            color: #000;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            background: #FFF;
            border: 3px solid #000;
            padding: 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-weight: bold;
        }

        .slime-ability {
            grid-column: span 2;
            color: #FF4444;
            margin-top: 5px;
            border-top: 2px dashed #000;
            padding-top: 5px;
        }

        .equip-toggle-btn {
            width: 100%;
            padding: 10px;
            border: 3px solid #000;
            border-radius: 4px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            margin-top: 5px;
        }

        .equip-toggle-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .btn-equip-action { background: #32CD32; color: white; }
        .btn-unequip-action { background: #FF4444; color: white; }

        /* モード選択・ショップ開発中表示 */
        .mode-selection-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            padding: 40px 0;
            height: 100%;
            align-items: center;
        }

        .dev-badge {
            display: block;
            background: #FFD700;
            color: #000;
            font-size: 1rem;
            padding: 5px 10px;
            border: 2px solid #000;
            border-radius: 4px;
            margin-top: 10px;
            text-shadow: none;
        }

        .dev-message-box {
            text-align: center;
            padding: 50px;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 6px 6px 0 #000;
            margin: auto;
            border-radius: 8px;
        }

        .dev-message-box p {
            color: #000;
            font-size: 2rem;
            text-shadow: none;
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- 1. 初回名前入力画面 -->
        <div id="name-input-screen" class="screen hidden">
            <h2 class="welcome-title rbx-text">⚔️ バトルスライムへようこそ！ ⚔️</h2>
            <div class="input-group">
                <label for="initial-name-input" class="input-label rbx-text">名前を入力してね（3文字以上12文字以下）</label>
                <input type="text" id="initial-name-input" class="text-input" placeholder="例: スライム勇者" maxlength="12">
                <div id="initial-name-error" class="error-message"></div>
                <button id="initial-name-submit-btn" class="primary-btn rbx-text">決定</button>
            </div>
        </div>

        <!-- 2. ホーム画面 -->
        <div id="home-screen" class="screen hidden">
            <header class="home-header">
                <h1 class="game-title rbx-text">バトルスライム</h1>
                <div class="header-user-info">
                    <span id="player-display-name" class="player-name-text rbx-text">----</span>
                    <button id="btn-settings" class="icon-btn" title="設定">⚙️</button>
                </div>
            </header>

            <main class="home-main-menu">
                <button id="btn-play" class="menu-btn play-btn rbx-text">🎮 プレイ</button>
                <button id="btn-shop" class="menu-btn shop-btn rbx-text">🛒 ショップ</button>
                <button id="btn-equip" class="menu-btn equip-btn rbx-text">🎒 装備</button>
            </main>
        </div>

        <!-- 3. 設定モーダル -->
        <div id="modal-settings" class="modal-overlay hidden">
            <div class="modal-content" style="max-width: 600px; height: auto;">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">⚙️ 設定</h3>
                    <button id="close-settings-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body" style="background: #5DADE2;">
                    <div class="input-group" style="max-width: 100%; box-shadow: none; border: none; padding: 0;">
                        <label for="settings-name-input" class="input-label rbx-text">名前の変更（3文字以上12文字以下）</label>
                        <input type="text" id="settings-name-input" class="text-input" maxlength="12">
                        <div id="settings-name-error" class="error-message"></div>
                        <button id="save-settings-btn" class="primary-btn rbx-text">変更を保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. プレイ選択モーダル -->
        <div id="modal-play" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🎮 モード選択</h3>
                    <button id="close-play-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="mode-selection-container">
                        <button class="primary-btn rbx-text" style="padding: 40px; font-size: 2rem;">
                            ⚔️ メインモード <span class="dev-badge">開発中</span>
                        </button>
                        <button class="primary-btn rbx-text" style="padding: 40px; font-size: 2rem; background: #696969;">
                            🎯 サブモード <span class="dev-badge">開発中</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. ショップモーダル -->
        <div id="modal-shop" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🛒 ショップ</h3>
                    <button id="close-shop-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="dev-message-box">
                        <p style="font-weight: bold;">🛒 ショップは現在準備・開発中です！</p>
                        <p style="font-size: 1.2rem; margin-top: 20px; color: #555;">今後のアップデートをお楽しみに！</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 6. 装備モーダル -->
        <div id="modal-equip" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title rbx-text">🎒 スライム装備</h3>
                    <button id="close-equip-btn" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <!-- 現在の装備スロット（最大8体） -->
                    <div>
                        <div class="equip-section-title rbx-text">装備中のスライム（最大8体）</div>
                        <div id="equipped-slots-grid" class="equipped-slots-container">
                            <!-- JS側で動的生成 -->
                        </div>
                    </div>

                    <!-- スライム検索 -->
                    <div class="search-bar-box">
                        <input type="text" id="slime-search-input" class="search-input" placeholder="🔍 スライムを名前で検索...">
                    </div>

                    <!-- 所持スライム一覧 -->
                    <div>
                        <div class="equip-section-title rbx-text">所持スライム一覧</div>
                        <div id="owned-slime-list" class="slime-list-grid">
                            <!-- JS側で動的生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- キャラクター構造・ステータス設定スクリプトの読み込み -->
    <script src="sub.js"></script>

    <!-- メイン操作・UI連動スクリプト -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // データ初期化
            PlayerDataManager.load();

            // DOM要素参照
            const nameInputScreen = document.getElementById('name-input-screen');
            const homeScreen = document.getElementById('home-screen');
            
            const initialNameInput = document.getElementById('initial-name-input');
            const initialNameError = document.getElementById('initial-name-error');
            const initialNameSubmitBtn = document.getElementById('initial-name-submit-btn');
            
            const playerDisplayName = document.getElementById('player-display-name');
            const btnSettings = document.getElementById('btn-settings');
            const btnPlay = document.getElementById('btn-play');
            const btnShop = document.getElementById('btn-shop');
            const btnEquip = document.getElementById('btn-equip');

            const modalSettings = document.getElementById('modal-settings');
            const settingsNameInput = document.getElementById('settings-name-input');
            const settingsNameError = document.getElementById('settings-name-error');
            const saveSettingsBtn = document.getElementById('save-settings-btn');
            const closeSettingsBtn = document.getElementById('close-settings-btn');

            const modalPlay = document.getElementById('modal-play');
            const closePlayBtn = document.getElementById('close-play-btn');

            const modalShop = document.getElementById('modal-shop');
            const closeShopBtn = document.getElementById('close-shop-btn');

            const modalEquip = document.getElementById('modal-equip');
            const closeEquipBtn = document.getElementById('close-equip-btn');
            const slimeSearchInput = document.getElementById('slime-search-input');
            const equippedSlotsGrid = document.getElementById('equipped-slots-grid');
            const ownedSlimeList = document.getElementById('owned-slime-list');

            /**
             * 初期起動チェック
             */
            function checkInitialFlow() {
                if (PlayerDataManager.hasName()) {
                    showHomeScreen();
                } else {
                    showNameInputScreen();
                }
            }

            /**
             * 名前入力画面の表示
             */
            function showNameInputScreen() {
                homeScreen.classList.add('hidden');
                nameInputScreen.classList.remove('hidden');
            }

            /**
             * ホーム画面の表示
             */
            function showHomeScreen() {
                nameInputScreen.classList.add('hidden');
                homeScreen.classList.remove('hidden');
                playerDisplayName.textContent = PlayerDataManager.getName();
            }

            /**
             * 名前のバリデーション
             */
            function validateName(name) {
                if (!name || name.trim().length === 0) {
                    return '名前を入力してください。';
                }
                const trimmed = name.trim();
                if (trimmed.length < 3 || trimmed.length > 12) {
                    return '名前は3文字以上12文字以下で入力してください。';
                }
                return null;
            }

            // 初回名前登録ボタンのクリックイベント
            initialNameSubmitBtn.addEventListener('click', () => {
                const value = initialNameInput.value;
                const error = validateName(value);
                if (error) {
                    initialNameError.textContent = error;
                } else {
                    initialNameError.textContent = '';
                    PlayerDataManager.setName(value.trim());
                    showHomeScreen();
                }
            });

            // 設定ボタン押下時
            btnSettings.addEventListener('click', () => {
                settingsNameInput.value = PlayerDataManager.getName();
                settingsNameError.textContent = '';
                modalSettings.classList.remove('hidden');
            });

            closeSettingsBtn.addEventListener('click', () => {
                modalSettings.classList.add('hidden');
            });

            // 設定保存ボタン
            saveSettingsBtn.addEventListener('click', () => {
                const value = settingsNameInput.value;
                const error = validateName(value);
                if (error) {
                    settingsNameError.textContent = error;
                } else {
                    settingsNameError.textContent = '';
                    PlayerDataManager.setName(value.trim());
                    playerDisplayName.textContent = PlayerDataManager.getName();
                    modalSettings.classList.add('hidden');
                }
            });

            // プレイボタン押下時
            btnPlay.addEventListener('click', () => {
                modalPlay.classList.remove('hidden');
            });
            closePlayBtn.addEventListener('click', () => {
                modalPlay.classList.add('hidden');
            });

            // ショップボタン押下時
            btnShop.addEventListener('click', () => {
                modalShop.classList.remove('hidden');
            });
            closeShopBtn.addEventListener('click', () => {
                modalShop.classList.add('hidden');
            });

            // 装備ボタン押下時
            btnEquip.addEventListener('click', () => {
                renderEquipModal();
                modalEquip.classList.remove('hidden');
            });
            closeEquipBtn.addEventListener('click', () => {
                modalEquip.classList.add('hidden');
            });

            // 検索入力変更時
            slimeSearchInput.addEventListener('input', () => {
                renderOwnedSlimes(slimeSearchInput.value);
            });

            /**
             * 装備画面（スロットおよび所持一覧）の描画更新
             */
            function renderEquipModal() {
                renderEquippedSlots();
                renderOwnedSlimes(slimeSearchInput.value);
            }

            /**
             * 装備枠（最大8スロット）の描画
             */
            function renderEquippedSlots() {
                equippedSlotsGrid.innerHTML = '';
                const equippedList = PlayerDataManager.getEquippedSlimes();

                for (let i = 0; i < 8; i++) {
                    const slotEl = document.createElement('div');
                    slotEl.className = 'equip-slot';

                    // スクショ風のヘッダー部分
                    const header = document.createElement('div');
                    header.className = 'equip-slot-header';
                    header.innerHTML = `<span>SLOT ${i + 1}</span>`;
                    slotEl.appendChild(header);

                    if (i < equippedList.length) {
                        const slime = equippedList[i];
                        slotEl.classList.add('filled');
                        
                        const img = document.createElement('img');
                        img.src = slime.image;
                        img.alt = slime.name;
                        
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'equip-slot-name rbx-text';
                        nameSpan.textContent = slime.name;

                        slotEl.appendChild(img);
                        slotEl.appendChild(nameSpan);
                    } else {
                        const emptyText = document.createElement('span');
                        emptyText.className = 'equip-slot-name rbx-text';
                        emptyText.style.color = '#555';
                        emptyText.textContent = 'EMPTY';
                        emptyText.style.margin = 'auto';
                        slotEl.appendChild(emptyText);
                    }

                    equippedSlotsGrid.appendChild(slotEl);
                }
            }

            /**
             * 所持スライム一覧（検索対応）の描画
             */
            function renderOwnedSlimes(keyword = '') {
                ownedSlimeList.innerHTML = '';
                const slimes = PlayerDataManager.searchOwnedSlimes(keyword);

                if (slimes.length === 0) {
                    ownedSlimeList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #000; font-size: 1.5rem; background: #fff; padding: 20px; border: 4px solid #000;">該当するスライムが見つかりません。</div>';
                    return;
                }

                slimes.forEach(slime => {
                    const isEquipped = PlayerDataManager.isEquipped(slime.id);

                    const card = document.createElement('div');
                    card.className = `slime-card ${isEquipped ? 'equipped-active' : ''}`;

                    card.innerHTML = `
                        <img src="${slime.image}" alt="${slime.name}" class="slime-img">
                        <div class="slime-name rbx-text">${slime.name}</div>
                        <div class="slime-stats">
                            <div>❤️ HP: ${slime.hp}</div>
                            <div>⚔️ 攻撃: ${slime.attack}</div>
                            <div>🛡️ 防御: ${slime.defense}</div>
                            <div>⏳ CT: ${slime.cooldown}s</div>
                            <div>🎯 射程: ${slime.range}</div>
                            <div class="slime-ability">✨ 能力: ${slime.ability}</div>
                        </div>
                        <button class="equip-toggle-btn rbx-text ${isEquipped ? 'btn-unequip-action' : 'btn-equip-action'}">
                            ${isEquipped ? '装備解除' : '装備する'}
                        </button>
                    `;

                    const btn = card.querySelector('.equip-toggle-btn');
                    btn.addEventListener('click', () => {
                        const result = PlayerDataManager.toggleEquip(slime.id);
                        if (!result.success) {
                            alert(result.message);
                        } else {
                            renderEquipModal();
                        }
                    });

                    ownedSlimeList.appendChild(card);
                });
            }

            // アプリ開始
            checkInitialFlow();
        });
    </script>
</body>
</html>
